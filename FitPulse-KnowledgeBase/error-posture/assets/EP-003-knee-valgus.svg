<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">膝盖内扣错误与纠正对比示意图</title>
  <desc id="desc">双栏正面示意图：左侧为深蹲膝盖内扣错误，右侧为膝盖对脚尖、足弓稳定的纠正姿势。</desc>
  <defs>
    <style>

      .bg{fill:#F7F3EA}
