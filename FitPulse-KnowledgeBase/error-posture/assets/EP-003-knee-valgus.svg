  <text x="648" y="196" class="card-title">纠正后</text>
  <text x="1120" y="196" text-anchor="end" class="sub">膝盖对第二、三趾</text>
  <line x1="648" y1="216" x2="1120" y2="216" class="hairline"/>
    <line class="ground" x1="714" y1="585" x2="994" y2="585"/>
  <ellipse cx="854" cy="591" rx="140" ry="8" fill="#D9D2C5" opacity=".55"/>
  <circle class="head" cx="854" cy="320" r="24"/>
  <path class="ink" d="M854 344 L854 500"/>
  <path class="ink2" d="M790 390 L918 390"/>
