<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">借力与惯性摆动错误与纠正对比示意图</title>
  <desc id="desc">双栏侧面示意图：左侧为划船借力甩动、身体摇摆错误，右侧为躯干稳定、受控拉动的纠正姿势。</desc>
  <defs>
    <style>

