<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">耸肩与颈部代偿错误与纠正对比示意图</title>
  <desc id="desc">双栏正面示意图：左侧为耸肩、颈部紧张错误，右侧为肩胛下沉、颈放松的纠正姿势。</desc>
  <defs>
    <style>

