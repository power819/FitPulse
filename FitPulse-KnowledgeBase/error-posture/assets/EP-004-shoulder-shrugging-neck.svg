  <text x="1120" y="196" text-anchor="end" class="sub">肩胛下沉、颈部放松</text>
  <line x1="648" y1="216" x2="1120" y2="216" class="hairline"/>
    <line class="ground" x1="734" y1="585" x2="974" y2="585"/>
