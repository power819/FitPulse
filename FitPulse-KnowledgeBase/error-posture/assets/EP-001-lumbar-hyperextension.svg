  <text x="1120" y="196" text-anchor="end" class="sub">骨盆后倾、核心收紧</text>
  <line x1="648" y1="216" x2="1120" y2="216" class="hairline"/>
    <line class="ground" x1="624" y1="570" x2="1084" y2="570"/>
  <ellipse cx="854" cy="576" rx="210" ry="8" fill="#D9D2C5" opacity=".55"/>
  <circle class="head" cx="854" cy="330" r="24"/>
