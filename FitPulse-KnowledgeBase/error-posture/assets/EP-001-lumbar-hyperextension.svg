<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">腰椎过伸（塌腰）错误与纠正对比示意图</title>
  <desc id="desc">双栏侧面示意图：左侧为平板支撑塌腰错误，右侧为骨盆后倾、核心收紧的纠正姿势。</desc>
  <defs>
    <style>

      .bg{fill:#F7F3EA}
